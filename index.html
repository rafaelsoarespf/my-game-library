<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--About Project-->
  <title>My Game Library</title>
  <meta name="description" content="My Game Library" />
  <meta name="author" content="Rafa" />
  <meta name="keywords" content="game, library" />
  <meta name="robots" content="index, follow" />
  <!--Theme-->
  <meta name="theme-color" content="#ffffff" />

  <!--Content Security Policy (CSP)-->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';img-src 'self' data: blob:;font-src 'self' data:;connect-src 'self' https: ws: wss:;object-src 'none';base-uri 'self';form-action 'self';upgrade-insecure-requests;" />
  <!--Referrer Policy-->
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!--Favicon-->
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" />
  <!-- Celestial Flow -->
  <link rel="stylesheet" href="vendor/celestial-flow/css/reset.css">
  <link rel="stylesheet" href="vendor/celestial-flow/css/globals.css">
  <link rel="stylesheet" href="vendor/celestial-flow/css/themes.css">
  <link rel="stylesheet" href="vendor/celestial-flow/css/fonts.css">
  <link rel="stylesheet" href="vendor/celestial-flow/css/typography.css">
  <link rel="stylesheet" href="vendor/celestial-flow/css/layout.css">
  <link rel="stylesheet" href="vendor/celestial-flow/css/spacing.css">
  <link rel="stylesheet" href="vendor/celestial-flow/css/appearance.css">
  <link rel="stylesheet" href="vendor/celestial-flow/css/decorative.css">
  <link rel="stylesheet" href="vendor/celestial-flow/css/components.css">
  <link rel="stylesheet" href="vendor/celestial-flow/css/forms.css">
  <link rel="stylesheet" href="vendor/celestial-flow/css/overlays.css">
  <link rel="stylesheet" href="vendor/celestial-flow/css/structure.css">
  <link rel="stylesheet" href="vendor/celestial-flow/css/animations.css">
  <script src="vendor/celestial-flow/js/celestial-flow.js" defer></script>
  <!--CSS-->
  <link rel="stylesheet" href="styles/app.css" />
  <!--Scripts-->
  <script type="module" src="dist/main.js"></script>
</head>

<!-- Body ====================================================================-->
<body class="sidebar-layout">
  <button class="sidebar__toggle" type="button" aria-label="Abrir formulário">☰</button>

  <!-- Sidebar ===============================================================-->
  <aside class="sidebar" aria-label="Formulário de jogo">
    <!-- Sidebar Header-->
    <div class="sidebar__header">
      <a class="logo" href="#">My Game <span class="text-accent">Library</span></a>
    </div>
    <!-- Form ================================================================-->
    <div class="sidebar__menu">
      <!-- Filters-->
      <div class="filters column gap-sm">
        <h2 class="mt text-lg" id="form__title">Filtros</h2>
        <div class="field">
          <input type="search" id="filters__search" placeholder=" " autocomplete="off" />
          <label for="filters__search">Buscar por nome, plataforma, gênero, conta…</label>
        </div>
        <div class="select" id="filters__status" data-value="">
          <button class="select__btn" type="button">Todos os status</button>
          <div class="select__menu" role="listbox">
            <div class="select__item" role="option" data-value="" data-selected>Todos os status</div>
            <div class="select__item" role="option" data-value="Aberto">Aberto</div>
            <div class="select__item" role="option" data-value="Em Andamento">Em Andamento</div>
            <div class="select__item" role="option" data-value="Concluído">Concluído</div>
            <div class="select__item" role="option" data-value="Abandonado">Abandonado</div>
            <div class="select__item" role="option" data-value="Pausado">Pausado</div>
          </div>
        </div>
      </div>
      <hr>
      <form class="column" id="form" autocomplete="off">
        <h2 class="mt text-lg" id="form__title">Novo jogo</h2>
        <!-- Form File-->
        <input type="hidden" id="form__file" name="arquivo" />
        <!-- Name-->
        <div class="field">
          <input type="text" id="form__name" name="nome" placeholder=" " required />
          <label for="form__name">Nome</label>
        </div>
        <!-- Status-->
        <div class="select" id="form__status" data-value="Aberto">
          <button class="select__btn" type="button">Aberto</button>
          <div class="select__menu" role="listbox">
            <div class="select__item" role="option" data-value="Aberto" data-selected>Aberto</div>
            <div class="select__item" role="option" data-value="Em Andamento">Em Andamento</div>
            <div class="select__item" role="option" data-value="Concluído">Concluído</div>
            <div class="select__item" role="option" data-value="Abandonado">Abandonado</div>
            <div class="select__item" role="option" data-value="Pausado">Pausado</div>
          </div>
        </div>
        <div class="grid">
          <!-- Ranking-->
          <div class="field">
            <input type="number" id="form__ranking" name="ranking" min="1" step="1" placeholder=" " />
            <label for="form__ranking">Ranking</label>
          </div>
          <!-- Platform-->
          <div class="field">
            <input type="text" id="form__platform" name="plataforma" placeholder=" " />
            <label for="form__platform">Plataforma</label>
          </div>
        </div>
        <!-- Account-->
        <div class="field">
          <input type="text" id="form__account" name="conta" placeholder=" " />
          <label for="form__account">Conta</label>
        </div>
        <!-- Price-->
        <div class="field">
          <input type="number" id="form__price" name="valor" min="0" step="0.01" placeholder=" " />
          <label for="form__price">Valor (R$)</label>
        </div>
        <!-- Genre-->
        <div class="field">
          <input type="text" id="form__genre" name="genero" placeholder=" " />
          <label for="form__genre">Gênero</label>
        </div>
        <!-- Image-->
        <div class="field">
          <input type="file" id="form__image" accept="image/png,image/jpeg,image/webp,image/gif" />
          <label for="form__image">Imagem</label>
        </div>
        <input type="hidden" id="form__image-path" name="imagem" />
        <!-- Image preview-->
        <img id="form__image-preview" class="width-100" alt="" hidden />
        <!-- Notes-->
        <div class="field">
          <input type="text" id="form__notes" name="obs" placeholder=" " />
          <label for="form__notes">OBS</label>
        </div>
        <!-- Description-->
        <div class="column gap-sm">
          <label for="form__description">Descrição (markdown)</label>
          <textarea id="form__description" name="descricao" rows="6"></textarea>
        </div>
        <!--Btns-->
        <div class="grid mt gap-sm">
          <!-- Btn Save -->
          <button class="btn" type="submit" form="form" id="form__save">Salvar</button>
          <!-- Btn Clear -->
          <button class="btn-outline" type="button" id="form__clear">Limpar</button>
        </div>
      </form>
    </div>
    <!-- Sidebar Footer-->
    <div class="sidebar__footer">
      <!--theme-selector-->
      <div class="theme-selector mt-sm width-full" data-preview></div>
    </div>
  </aside>

  <!-- Main ==================================================================-->
  <main class="section-sm p">
    <h1 class="title mb container">My Game Library</h1>
    <!-- Games List-->
    <section class="row" id="games__list" aria-live="polite"></section>
    <p class="alert" id="games__empty-list" hidden>Nenhum jogo encontrado.</p>
  </main>
 
  <!-- Template: game card ===================================================-->
  <template id="games__template">
    <article class="card-img width-300">
      <img alt="" loading="lazy"/>
      <h3 data-field="title"></h3>
      <span class="badge" data-field="status"></span>
      <p class="text-sm" data-field="details"></p>
      <p class="text-sm" data-field="price"></p>
      <p class="text-sm" data-field="notes"></p>
      <p class="text-sm" data-field="description"></p>
      <div class="row gap-sm">
        <button class="btn-outline" type="button" data-action="edit">Editar</button>
        <button class="btn-outline" type="button" data-action="delete">Excluir</button>
      </div>
    </article>
  </template>
 
  <!-- Modal: confirm delete =================================================-->
  <div class="modal" id="delete-modal" role="alertdialog" aria-modal="true" aria-labelledby="delete-modal__title">
    <div class="modal__content">
      <a class="modal__close" href="#" aria-label="Fechar">×</a>
      <h2 class="title" id="delete-modal__title">Excluir jogo</h2>
      <p class="mt mb">Excluir <strong id="delete-modal__name"></strong>? O arquivo .md será removido.</p>
      <div class="row gap-sm right">
        <a class="btn-outline" href="#">Cancelar</a>
        <button class="btn" type="button" id="delete-modal__confirm">Excluir</button>
      </div>
    </div>
  </div>

</body>
</html>
